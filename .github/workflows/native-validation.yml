name: Native PR validation
run-name: 'Native archive PR 1: 553bebf00e38'

on:
  push:
    branches: [bvolpato/native-validation-20261111]
    paths: [.github/workflows/native-validation.yml]

permissions:
  contents: read

concurrency:
  group: native-pr-validation
  cancel-in-progress: false

jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SOURCE_REF: 553bebf00e38657e3a8225a60ea7e1c6e8e5f07a
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Check out the exact upstream PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: bvolpato/libarchive.xcframework
          ref: 553bebf00e38657e3a8225a60ea7e1c6e8e5f07a
          persist-credentials: false

      - name: Prepare build tools and record provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          test -d "$DEVELOPER_DIR"
          brew install cmake ninja xcbeautify
          mkdir -p build/validation
          {
            git rev-parse HEAD
            xcodebuild -version
            xcodebuild -showsdks
            swift --version
            cat Upstream.versions
          } | tee build/validation/provenance.txt

      - name: Build all five platform groups sequentially
        shell: bash
        run: |
          set -euo pipefail
          for group in macos ios tvos watchos visionos; do
            ./Script/build-platform.sh "$group" ./build/dest 2>&1 |
              tee "build/validation/build-$group.log"
          done
          for component in libarchive xz zstd lz4; do
            printf '%s ' "$component"
            git -C "build/src/$component" rev-parse HEAD
          done | tee build/validation/compiled-sources.txt

      - name: Merge and verify the ten-slice XCFramework archive
        shell: bash
        run: |
          set -euo pipefail
          ./Script/merge-xcframework.sh ./build/dest ./build/libarchive.xcframework.zip 2>&1 |
            tee build/validation/merge.log
          test -d BinaryTarget/libarchive.xcframework
          shasum -a 256 build/libarchive.xcframework.zip | tee build/validation/sha256.txt

      - name: Build every consumer destination and run Swift tests against the candidate
        shell: bash
        run: |
          set -euo pipefail
          test -d BinaryTarget/libarchive.xcframework
          ./Script/test.sh 2>&1 | tee build/validation/consumer-tests.log

      - name: Upload validation evidence and the test artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libarchive-native-validation
          path: |
            build/validation/
            build/libarchive.xcframework.zip
          if-no-files-found: error
          retention-days: 14
